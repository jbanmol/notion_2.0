<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NΞONOTION ⚡</title>
    
    <!-- Google Fonts: Futuristic Outfit, Code Share Tech Mono, Clean Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons for high-fidelity tech design -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Global CSS stylesheet -->
    <link rel="stylesheet" href="src/style.css">
</head>
<body class="theme-obsidian">
    <!-- Holographic grid scanline background layers -->
    <div class="cyber-grid-overlay"></div>
    <div class="cyber-scanline"></div>

    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar-panel glass-panel">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="logo-icon-container">
                        <i data-lucide="cpu" class="neon-glow-icon pink"></i>
                    </div>
                    <div class="brand-text-group">
                        <span class="brand-text">NEO<span class="highlight">NOTION</span></span>
                        <span class="brand-subtitle font-mono">CYBERNETIC_WORKSPACE</span>
                    </div>
                </div>
                <div class="system-status">
                    <span class="status-dot pulsing"></span>
                    <span class="status-text font-mono">SYS_OK v2.0</span>
                </div>
            </div>

            <!-- Page Management -->
            <div class="sidebar-actions">
                <button id="add-page-btn" class="cyber-btn glass-btn">
                    <i data-lucide="plus-circle"></i>
                    <span>NEW_NODE.EXE</span>
                </button>
            </div>

            <!-- Sidebar Search Filter (Task 6.1) -->
            <div class="sidebar-search-wrapper">
                <i data-lucide="search" class="sidebar-search-icon"></i>
                <input type="text" id="sidebar-search" class="sidebar-search-input font-mono" placeholder="FILTER_NODES..." autocomplete="off">
            </div>

            <!-- Navigation Tree -->
            <nav class="sidebar-nav">
                <div class="nav-section-title font-mono">WORKSPACE_NODES</div>
                <ul id="sidebar-document-list" class="document-list">
                    <!-- Dynamic Document Tree injected here -->
                </ul>
            </nav>

            <!-- Sidebar Footer Diagnostics -->
            <div class="sidebar-footer font-mono">
                <div class="diagnostic-row">
                    <span>MEMORY_ALLOC:</span>
                    <span class="highlight cyan">84.2%</span>
                </div>
                <div class="diagnostic-row">
                    <span>NET_ENCRYPT:</span>
                    <span class="highlight green">STABLE</span>
                </div>
            </div>
        </aside>

        <!-- MAIN EDITOR VIEWPORT -->
        <main class="main-viewport glass-panel">
            <!-- Header Utilities -->
            <header class="viewport-header">
                <div class="breadcrumbs font-mono">
                    <i data-lucide="terminal" class="cyan"></i>
                    <span class="root-node">ROOT</span>
                    <span class="separator">//</span>
                    <span id="active-document-breadcrumb" class="active-node">INITIALIZING...</span>
                </div>

                <div class="header-utilities">
                    <!-- Command Palette Button -->
                    <button id="search-btn" class="utility-icon-btn font-mono" title="Search nodes (Cmd+K)">
                        <i data-lucide="search"></i>
                        <span class="btn-hotkey">⌘K</span>
                    </button>

                    <!-- Persistent Timer Pill (Task 7.1) -->
                    <button id="timer-pill" class="timer-pill font-mono" title="Toggle Mission Timer">
                        <i data-lucide="timer"></i>
                        <span id="timer-pill-display">25:00</span>
                    </button>

                    <!-- Global Audio Mute Switch -->
                    <button id="audio-mute-btn" class="utility-icon-btn font-mono" title="Toggle Global Key Sound">
                        <i data-lucide="volume-2"></i>
                        <span class="btn-label">SOUND</span>
                    </button>

                    <!-- Focus Mode Toggle -->
                    <button id="focus-toggle-btn" class="utility-icon-btn focus-btn font-mono" title="Engage Focus Mode (Cmd+Shift+F)">
                        <i data-lucide="target"></i>
                        <span class="btn-label">FOCUS</span>
                        <span class="btn-hotkey">⌘⇧F</span>
                    </button>

                    <!-- Audio Profile Selector (hidden until focus mode active) -->
                    <select id="audio-profile-select" class="audio-select font-mono" title="Click Sound Profile">
                        <option value="mech">🔩 MECH</option>
                        <option value="vaporwave">🌸 VAPOR</option>
                        <option value="dystopian">🌧 BASS</option>
                        <option value="glitch">⚡ GLITCH</option>
                    </select>

                    <!-- Theme Toggle Hub -->
                    <div class="theme-selector">
                        <button id="theme-toggle-btn" class="utility-icon-btn" title="Cycle Neon Themes">
                            <i data-lucide="palette" class="pink"></i>
                        </button>
                        <div class="theme-dropdown glass-panel hidden" id="theme-dropdown">
                            <button data-theme="theme-obsidian" class="theme-opt active">
                                <span class="dot obsidian"></span> Obsidian Core
                            </button>
                            <button data-theme="theme-vaporwave" class="theme-opt">
                                <span class="dot vaporwave"></span> Glitch Pink
                            </button>
                            <button data-theme="theme-amber" class="theme-opt">
                                <span class="dot amber"></span> Tech Amber
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Editor Container -->
            <section class="editor-container">
                <div class="editor-scroller">
                    <!-- Title Input Field -->
                    <input type="text" id="document-title" class="editor-title-input" placeholder="UNNAMED_NODE..." autocomplete="off">
                    
                    <!-- Dynamic Blocks Workspace -->
                    <div id="editor-workspace" class="editor-blocks-container">
                        <!-- Blocks Injected dynamically -->
                    </div>
                </div>

                <!-- Editor Footer: Word Count (Task 4.3) -->
                <div id="editor-footer" class="editor-footer font-mono">
                    <span id="word-count-display" class="word-count-text">0 words · 0 min read</span>
                </div>
            </section>
        </main>
    </div>

    <!-- HOLOGRAPHIC COMMAND PALETTE -->
    <div id="command-palette" class="palette-overlay hidden">
        <div class="palette-container glass-panel animate-slide-up">
            <div class="palette-search-wrapper">
                <i data-lucide="search" class="palette-search-icon"></i>
                <input type="text" id="palette-search-input" placeholder="Type a command or search nodes..." autocomplete="off">
                <span class="palette-escape font-mono">ESC</span>
            </div>
            <div class="palette-results" id="palette-results">
                <!-- Search results injected here -->
            </div>
            <div class="palette-footer font-mono">
                <span>↑↓ Navigate</span>
                <span>↵ Select</span>
                <span>/ Switch node</span>
            </div>
        </div>
    </div>

    <!-- SLASH COMMAND MENU (Task 2.1) -->
    <div id="slash-menu" class="slash-menu glass-panel hidden">
        <!-- Items injected dynamically -->
    </div>

    <!-- EMOJI PICKER (Task 5.2) -->
    <div id="emoji-picker" class="emoji-picker glass-panel hidden">
        <div class="emoji-grid">
            <!-- Emojis injected dynamically -->
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         FOCUS MODE FLOATING MISSION TIMER HUD
         ═══════════════════════════════════════════════════════════ -->
    <div id="mission-timer-hud" class="mission-hud glass-panel hidden">
        <div class="hud-header font-mono">
            <span class="hud-label"><i data-lucide="shield-alert"></i> INTRUSION_TIMER</span>
            <button id="hud-close-btn" class="hud-close-btn" title="Close HUD">✕</button>
        </div>
        <div class="hud-display">
            <div id="timer-display" class="timer-digits font-mono">25:00</div>
            <div class="timer-status font-mono" id="timer-status-text">STANDBY</div>
        </div>
        <div class="hud-controls">
            <button id="timer-start-btn" class="hud-btn hud-btn-start font-mono">
                <i data-lucide="play"></i> START
            </button>
            <button id="timer-pause-btn" class="hud-btn hud-btn-pause font-mono" disabled>
                <i data-lucide="pause"></i> PAUSE
            </button>
            <button id="timer-reset-btn" class="hud-btn hud-btn-reset font-mono">
                <i data-lucide="rotate-ccw"></i> RESET
            </button>
        </div>
        <div class="hud-progress-bar">
            <div id="hud-progress-fill" class="hud-progress-fill"></div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         FOCUS AMBIENT BACKGROUND — Nebula + Digital Snow
         ═══════════════════════════════════════════════════════════ -->
    <div id="focus-ambient-bg" class="focus-ambient-bg hidden">
        <div class="nebula-layer nebula-1"></div>
        <div class="nebula-layer nebula-2"></div>
        <div class="nebula-layer nebula-3"></div>
        <div class="cyber-grid-scan"></div>
    </div>
    <canvas id="focus-snow-canvas" class="focus-snow-canvas hidden"></canvas>

    <!-- Timer Completion Modal -->
    <div id="timer-complete-modal" class="timer-modal hidden">
        <div class="timer-modal-card glass-panel">
            <div class="modal-icon">🎯</div>
            <h2 class="modal-title font-mono">MISSION_COMPLETE</h2>
            <p class="modal-desc">Intrusion window elapsed. Neural bandwidth restored.</p>
            <button id="modal-dismiss-btn" class="hud-btn hud-btn-start font-mono">ACKNOWLEDGED ✓</button>
        </div>
    </div>

    <!-- CYBER MODAL (Tasks 1.3-1.4) -->
    <div id="cyber-modal" class="cyber-modal-overlay hidden">
        <div class="cyber-modal-card glass-panel">
            <div class="cyber-modal-icon">⚠️</div>
            <p class="cyber-modal-msg font-mono"></p>
            <div class="cyber-modal-actions">
                <button id="cyber-modal-confirm" class="hud-btn hud-btn-start font-mono">CONFIRM ✓</button>
                <button id="cyber-modal-cancel"  class="hud-btn hud-btn-reset font-mono">CANCEL ✗</button>
            </div>
        </div>
    </div>

    <!-- Application Script entry point -->
    <script type="module" src="src/app.js"></script>
</body>
</html>
